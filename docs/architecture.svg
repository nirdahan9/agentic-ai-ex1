<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#757575"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1430" fill="#ffffff"/>

  <!-- Title and legend -->
  <text x="800" y="42" text-anchor="middle" font-size="27" font-weight="bold" fill="#222">Architecture: personal chat with an answer evaluator and an improvement loop</text>
  <g font-size="15" fill="#333">
    <line x1="330" y1="72" x2="380" y2="72" stroke="#1565c0" stroke-width="5"/><text x="388" y="77">feedback arc</text>
    <line x1="530" y1="72" x2="580" y2="72" stroke="#2e7d32" stroke-width="3"/><text x="588" y="77">exit: approved</text>
    <line x1="740" y1="72" x2="790" y2="72" stroke="#b8860b" stroke-width="3"/><text x="798" y="77">exit: attempts exhausted</text>
    <line x1="1010" y1="72" x2="1060" y2="72" stroke="#c62828" stroke-width="3" stroke-dasharray="8 6"/><text x="1068" y="77">exit: technical error</text>
  </g>

  <g transform="translate(0,30)">
    <!-- Background sources -->
    <rect x="40" y="90" width="380" height="120" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="230" y="122" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">Background sources (data/)</text>
    <text x="230" y="153" text-anchor="middle" font-size="16" fill="#222">linkedin_profile.txt</text>
    <text x="230" y="180" text-anchor="middle" font-size="16" fill="#222">personal_summary.txt</text>

    <!-- Gradio chat UI -->
    <rect x="470" y="70" width="1090" height="160" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="9 5"/>
    <text x="490" y="96" font-size="17" font-weight="bold" fill="#4a148c">Gradio chat UI (app.py) · Hebrew, right-to-left</text>
    <rect x="560" y="112" width="300" height="88" rx="8" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
    <text x="710" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">User question</text>
    <text x="710" y="176" text-anchor="middle" font-size="14" fill="#555">+ scenario ID (for the log)</text>
    <rect x="1180" y="112" width="350" height="88" rx="8" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
    <text x="1355" y="146" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Conversation history</text>
    <text x="1355" y="172" text-anchor="middle" font-size="14" fill="#555">user messages + approved answers only</text>
    <text x="1020" y="150" text-anchor="middle" font-size="14" fill="#555">the user sees only</text>
    <text x="1020" y="170" text-anchor="middle" font-size="14" fill="#555">final answers / status messages</text>

    <!-- Loop frame -->
    <rect x="300" y="262" width="900" height="858" rx="14" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="320" y="1086" font-size="15" font-weight="bold" fill="#555">Loop for one question · chat/loop.py</text>
    <text x="320" y="1107" font-size="14" fill="#555">at most 3 generation attempts · counter resets for each new question</text>

    <!-- Inputs into the Actor -->
    <path d="M230,210 L230,292 L680,292 L680,318" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <text x="312" y="284" font-size="14" fill="#333">background sources</text>
    <path d="M760,200 L760,318" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <text x="770" y="250" font-size="14" fill="#333">question</text>
    <path d="M1355,200 L1355,292 L900,292 L900,318" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <text x="1215" y="284" font-size="14" fill="#333">conversation history</text>

    <!-- Actor -->
    <rect x="620" y="320" width="360" height="110" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2.5"/>
    <text x="800" y="350" text-anchor="middle" font-size="19" font-weight="bold" fill="#bf360c">ACTOR (answer generator)</text>
    <text x="800" y="377" text-anchor="middle" font-size="14" fill="#222">chat/actor.py · gpt-5.4-mini-2026-03-17</text>
    <text x="800" y="400" text-anchor="middle" font-size="14" fill="#222">prompts/actor_system.md + glossary.md</text>

    <!-- Candidate -->
    <path d="M800,430 L800,466" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <rect x="680" y="470" width="240" height="56" rx="8" fill="#fffde7" stroke="#827717" stroke-width="2"/>
    <text x="800" y="504" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Candidate answer</text>

    <!-- Evaluator -->
    <path d="M800,526 L800,562" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <rect x="620" y="566" width="360" height="124" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="800" y="594" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b5e20">EVALUATOR (Critic)</text>
    <text x="800" y="619" text-anchor="middle" font-size="14" fill="#222">chat/evaluator.py · gpt-5.4-2026-03-05</text>
    <text x="800" y="642" text-anchor="middle" font-size="14" fill="#222">evaluator_system.md + evaluator_user.md</text>
    <text x="800" y="668" text-anchor="middle" font-size="13.5" font-style="italic" fill="#444">input: question · candidate · sources · history</text>

    <!-- Evaluation result -->
    <path d="M800,690 L800,716" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <polygon points="800,720 1010,800 800,880 590,800" fill="#ede7f6" stroke="#4527a0" stroke-width="2.5"/>
    <text x="800" y="786" text-anchor="middle" font-size="18" font-weight="bold" fill="#311b92">Evaluation result</text>
    <text x="800" y="808" text-anchor="middle" font-size="14" fill="#222">validated with Pydantic</text>
    <text x="800" y="829" text-anchor="middle" font-size="14" fill="#222">is_acceptable: bool · feedback: str</text>

    <!-- Attempts left -->
    <path d="M800,880 L800,916" stroke="#333" stroke-width="2" marker-end="url(#ah-black)"/>
    <text x="812" y="904" font-size="14" font-weight="bold" fill="#333">is_acceptable = False</text>
    <polygon points="800,920 950,980 800,1040 650,980" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="800" y="976" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Attempts left?</text>
    <text x="800" y="998" text-anchor="middle" font-size="14" fill="#444">(fewer than 3 so far)</text>

    <!-- FEEDBACK ARC -->
    <path d="M650,980 L445,980 L445,395 L612,395" fill="none" stroke="#1565c0" stroke-width="5" marker-end="url(#ah-blue)"/>
    <text x="560" y="970" font-size="15" font-weight="bold" fill="#1565c0">yes</text>
    <rect x="325" y="590" width="240" height="122" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
    <text x="445" y="618" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">FEEDBACK ARC</text>
    <text x="445" y="642" text-anchor="middle" font-size="14" fill="#222">rejected answer + feedback</text>
    <text x="445" y="663" text-anchor="middle" font-size="14" fill="#222">+ question, sources, history</text>
    <text x="445" y="684" text-anchor="middle" font-size="14" fill="#222">→ request a corrected version</text>
    <text x="445" y="703" text-anchor="middle" font-size="12.5" fill="#555">prompts/actor_revision.md</text>

    <!-- Exit: approved -->
    <path d="M1010,800 L1118,800 A12,12 0 0 1 1142,800 L1252,800" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ah-green)"/>
    <text x="1020" y="776" font-size="14" font-weight="bold" fill="#2e7d32">is_acceptable</text>
    <text x="1020" y="793" font-size="14" font-weight="bold" fill="#2e7d32">= True</text>
    <rect x="1260" y="750" width="300" height="100" rx="10" fill="#d4edda" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="1410" y="780" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e20">EXIT: approved</text>
    <text x="1410" y="806" text-anchor="middle" font-size="14" fill="#222">show the answer in the chat</text>
    <text x="1410" y="828" text-anchor="middle" font-size="14" fill="#222">and add it to the history</text>
    <path d="M1500,750 L1500,208" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#ah-green)"/>
    <text x="1490" y="470" text-anchor="end" font-size="14" font-weight="bold" fill="#2e7d32">add to history</text>

    <!-- Exit: attempts exhausted -->
    <path d="M800,1040 L800,1146" stroke="#b8860b" stroke-width="3" marker-end="url(#ah-amber)"/>
    <text x="812" y="1070" font-size="14" font-weight="bold" fill="#8d6e00">no (3rd answer rejected)</text>
    <rect x="640" y="1150" width="320" height="100" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="2.5"/>
    <text x="800" y="1180" text-anchor="middle" font-size="18" font-weight="bold" fill="#5d4300">EXIT: attempts exhausted</text>
    <text x="800" y="1205" text-anchor="middle" font-size="14" fill="#222">show "no approved answer" message</text>
    <text x="800" y="1227" text-anchor="middle" font-size="14" fill="#222">rejected drafts stay in the log only</text>

    <!-- Exit: technical error -->
    <path d="M980,350 L1130,350" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M980,628 L1130,628" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8 6"/>
    <path d="M1130,350 L1130,1146" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ah-red)"/>
    <text x="1142" y="345" font-size="14" font-weight="bold" fill="#c62828">Actor call fails</text>
    <text x="1142" y="612" font-size="14" font-weight="bold" fill="#c62828">Evaluator call fails or output</text>
    <text x="1142" y="631" font-size="14" font-weight="bold" fill="#c62828">cannot be parsed / validated</text>
    <text x="1142" y="650" font-size="13" fill="#c62828">(EvaluationError)</text>
    <rect x="1000" y="1150" width="270" height="100" rx="10" fill="#f8d7da" stroke="#c62828" stroke-width="2.5"/>
    <text x="1135" y="1180" text-anchor="middle" font-size="18" font-weight="bold" fill="#7f0000">EXIT: technical error</text>
    <text x="1135" y="1205" text-anchor="middle" font-size="14" fill="#222">"evaluation not completed"</text>
    <text x="1135" y="1227" text-anchor="middle" font-size="14" fill="#222">show error message · log reason</text>

    <!-- Check log -->
    <path d="M800,1250 L800,1292" stroke="#757575" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah-gray)"/>
    <path d="M1135,1250 L1135,1292" stroke="#757575" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah-gray)"/>
    <path d="M1410,850 L1410,1292" stroke="#757575" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah-gray)"/>
    <rect x="40" y="1296" width="1520" height="84" rx="10" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
    <text x="800" y="1325" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">Check log · logs/check_log.jsonl (separate from the chat)</text>
    <text x="800" y="1350" text-anchor="middle" font-size="14" fill="#333">per question: scenario_id, question, final_status (approved / attempts_exhausted / technical_error)</text>
    <text x="800" y="1370" text-anchor="middle" font-size="14" fill="#333">per attempt: attempt number, candidate answer, evaluator decision + feedback — or "evaluation not completed" on a technical error</text>
  </g>
</svg>
